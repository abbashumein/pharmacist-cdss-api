name: MLOps Automated Pipeline
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
    - name: Cache Hugging Face models (MiniLM + CrossEncoder)
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: hf-models-v1
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # CPU-only torch keeps the install small and fast
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install -r requirements.txt pytest httpx
        pip install langchain-chroma==0.1.4 --no-deps
    - name: Run tests
      env:
        GEMINI_API_KEY: test-key
        CDSS_API_KEY: test-cdss-key
      run: python -m pytest tests/test_agentic_session.py tests/test_v2_startup.py -v

  # Azure deployment is disabled: the free tier ended. The app was deployed
  # on Azure Container Apps earlier and now runs locally / in Docker.
  # To re-enable, add a deploy job here that needs: test.
