name: MLOps Automated Pipeline

on: [push]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi pydantic uvicorn chromadb langgraph google-genai sentence-transformers python-dotenv

    - name: Validate Core Imports
      run: |
        python -c "from fastapi import FastAPI; print('FastAPI OK')"
        python -c "import chromadb; print('ChromaDB OK')"
        python -c "from langgraph.graph import StateGraph; print('LangGraph OK')"

    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

    - name: Login to ACR
      uses: azure/docker-login@v1
      with:
        login-server: cafb7024917facr.azurecr.io
        username: ${{ secrets.AZURE_CLIENT_ID }}
        password: ${{ secrets.AZURE_CLIENT_SECRET }}

    - name: Build and Push Docker Image
      run: |
        docker build -t cafb7024917facr.azurecr.io/pharmacist-cdss:latest .
        docker push cafb7024917facr.azurecr.io/pharmacist-cdss:latest

    - name: Deploy to Azure Container Apps
      run: |
        az containerapp create \
          --name pharmacist-cdss \
          --resource-group cdss-rg \
          --environment pharmacist-cdss-env \
          --image cafb7024917facr.azurecr.io/pharmacist-cdss:latest \
          --target-port 8000 \
          --ingress external \
          --registry-server cafb7024917facr.azurecr.io \
          --registry-username ${{ secrets.AZURE_CLIENT_ID }} \
          --registry-password ${{ secrets.AZURE_CLIENT_SECRET }} \
          --env-vars GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} CDSS_API_KEY=${{ secrets.CDSS_API_KEY }} \
        || az containerapp update \
          --name pharmacist-cdss \
          --resource-group cdss-rg \
          --image cafb7024917facr.azurecr.io/pharmacist-cdss:latest

    - name: Get Live URL
      run: |
        az containerapp show --name pharmacist-cdss --resource-group cdss-rg --query "properties.configuration.ingress.fqdn" -o tsv